<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CoConsult — Transparent Medical AI Collaboration Prototype</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Top Header -->
  <header class="app-header">
    <div class="header-left">
      <h1>CoConsult</h1>
      <p class="subtitle" data-i18n="subtitle"></p>
    </div>
    <div class="header-right">
      <div class="lang-switcher" role="group" aria-label="Language Switcher">
        <button class="lang-btn active" data-lang="en" type="button">EN</button>
        <button class="lang-btn" data-lang="zh" type="button">中文</button>
        <button class="lang-btn" data-lang="it" type="button">IT</button>
      </div>
      <!-- Clickable Option B AI Engine & Context Inspector Button -->
      <button id="btn-api-settings" class="status-pill simulated clickable-pill" type="button">
        <span id="api-status-text"></span> ⚙
      </button>
    </div>
  </header>

  <!-- Role Switcher Navigation (Prototype Simulation of 3 Physical Terminals) -->
  <nav class="role-nav" aria-label="System Role Switcher">
    <button class="nav-btn active" data-view="patient" type="button">
      <span data-i18n="navPatientTitle"></span>
      <span class="nav-sub" data-i18n="navPatientSub"></span>
    </button>
    <button class="nav-btn" data-view="doctor" type="button">
      <span data-i18n="navDoctorTitle"></span>
      <span class="nav-sub" data-i18n="navDoctorSub"></span>
    </button>
    <button class="nav-btn" data-view="shared" type="button">
      <span data-i18n="navSharedTitle"></span>
      <span class="nav-sub" data-i18n="navSharedSub"></span>
    </button>
  </nav>

  <main class="container">
    <!-- ================= VIEW 1: PATIENT ================= -->
    <section id="view-patient" class="view-section active">
      <!-- Pre-Visit Symptom Preparation -->
      <div class="card">
        <div class="card-header">
          <h2 data-i18n="previsitTitle"></h2>
          <span class="badge implemented" data-i18n="badgeImplemented"></span>
        </div>
        <p class="helper-text" data-i18n-html="previsitDesc"></p>

        <label for="symptom-input" class="input-label" data-i18n="symptomLabel"></label>
        <textarea id="symptom-input" rows="4"></textarea>

        <div class="action-row">
          <button id="btn-load-sample" class="btn secondary" type="button" data-i18n="btnLoadSample"></button>
          <button id="btn-ask-ai" class="btn primary" type="button" data-i18n="btnAskAI"></button>
        </div>

        <div id="ai-loading" class="loading-box hidden">
          <div class="spinner"></div>
          <span data-i18n="aiLoadingText"></span>
        </div>

        <div id="ai-previsit-result" class="ai-card hidden">
          <div class="ai-card-header">
            <span id="ai-previsit-badge" class="badge ai-badge"></span>
            <span class="disclaimer-tag" data-i18n="aiDisclaimer"></span>
          </div>
          <div id="ai-previsit-fallback-note" class="notice-warning hidden"></div>
          <div id="ai-previsit-body" class="ai-card-body"></div>

          <div class="disclosure-box">
            <label class="checkbox-row">
              <input type="checkbox" id="share-ai-checkbox" checked />
              <span>
                <strong data-i18n="shareCheckTitle"></strong>
                <small data-i18n="shareCheckSub"></small>
              </span>
            </label>
            <button id="btn-send-doctor" class="btn success" type="button" data-i18n="btnSendDoctor"></button>
          </div>
          <div id="patient-submit-feedback" class="feedback-banner hidden"></div>
        </div>
      </div>

      <!-- Lab Report & Scan Upload + Private Free-Text Q&A -->
      <div class="card">
        <div class="card-header">
          <h2 data-i18n="labUploadTitle"></h2>
          <span class="badge implemented" data-i18n="badgeImplemented"></span>
        </div>
        <p class="helper-text" data-i18n-html="labUploadDesc"></p>

        <!-- Doctor's Preliminary Feedback & Ordered Tests -->
        <div id="patient-orders-banner" class="orders-banner hidden">
          <div id="patient-prelim-feedback-wrap" class="prelim-feedback-box hidden">
            <strong data-i18n="patientPrelimHeading"></strong>
            <p id="patient-prelim-feedback-text"></p>
          </div>
          <strong data-i18n="ordersReceivedTitle"></strong>
          <ul id="patient-orders-list"></ul>
        </div>

        <!-- Upload Area -->
        <div class="upload-box">
          <label for="lab-file-input" class="input-label" data-i18n="uploadLabel"></label>
          <input type="file" id="lab-file-input" accept="image/*,.pdf" />

          <div class="action-row">
            <button id="btn-load-sample-lab" class="btn secondary" type="button" data-i18n="btnLoadSampleLab"></button>
            <button id="btn-analyse-lab" class="btn primary" type="button"></button>
          </div>

          <div id="uploaded-file-preview" class="file-preview hidden">
            <span id="uploaded-file-name" class="file-chip"></span>
            <img id="uploaded-image-thumb" class="thumb-img hidden" alt="Uploaded medical scan preview" />
          </div>
        </div>

        <div id="lab-ai-loading" class="loading-box hidden">
          <div class="spinner"></div>
          <span data-i18n="labLoadingText"></span>
        </div>

        <!-- Highlighted Lab & Scan Explanation -->
        <div id="lab-ai-result" class="ai-card hidden">
          <div class="ai-card-header">
            <span class="badge ai-badge" data-i18n="badgeAILab"></span>
            <span class="disclaimer-tag" data-i18n="labDisclaimer"></span>
          </div>
          <div id="lab-ai-body"></div>

          <!-- Private Free-Text Follow-Up Q&A -->
          <div class="qa-section">
            <div class="qa-header-row">
              <h3 data-i18n="qaTitle"></h3>
              <span class="privacy-pill" data-i18n="qaPrivacyPill"></span>
            </div>
            <p class="helper-text" data-i18n="qaDesc"></p>
            <div class="qa-input-row">
              <input type="text" id="qa-input" />
              <button id="btn-qa-send" class="btn primary" type="button" data-i18n="btnQASend"></button>
            </div>
            <div id="qa-loading" class="loading-box hidden">
              <div class="spinner"></div>
              <span data-i18n="qaLoadingText"></span>
            </div>
            <div id="qa-history" class="qa-history"></div>
          </div>

          <!-- Voluntarily Selected Questions for Doctor -->
          <div id="doctor-questions-box" class="saved-questions-box hidden">
            <h4 data-i18n="savedQuestionsTitle"></h4>
            <ul id="doctor-questions-list" class="removable-q-list"></ul>
          </div>

          <!-- Tiered Privacy Disclosure Control -->
          <div class="disclosure-box">
            <label class="checkbox-row">
              <input type="checkbox" id="share-questions-checkbox" />
              <span>
                <strong data-i18n="shareQuestionsTitle"></strong>
                <small data-i18n="shareQuestionsSub"></small>
              </span>
            </label>
            <button id="btn-send-lab-doctor" class="btn success" type="button" data-i18n="btnSendLabDoctor"></button>
            <div id="lab-submit-feedback" class="feedback-banner hidden"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= VIEW 2: DOCTOR ================= -->
    <section id="view-doctor" class="view-section">
      <!-- Incoming Pre-Visit Brief, Preliminary Feedback & Searchable Orders -->
      <div class="card">
        <div class="card-header">
          <h2 data-i18n="docPanelTitle"></h2>
          <span class="badge doctor-badge" data-i18n="badgeDoctorPanel"></span>
        </div>

        <div id="doctor-empty-state" class="empty-state">
          <p data-i18n="docEmptyTitle"></p>
          <p class="helper-text" data-i18n-html="docEmptyDesc"></p>
        </div>

        <div id="doctor-patient-card" class="hidden">
          <div class="info-block">
            <h3 data-i18n="docSymptomsHeading"></h3>
            <p id="doc-patient-symptoms" class="quote-box"></p>
          </div>

          <div id="doc-ai-shared-box" class="info-block ai-review-block hidden">
            <div class="block-title-row">
              <h3 data-i18n="docAISharedHeading"></h3>
              <span id="doc-ai-shared-badge" class="badge ai-badge"></span>
            </div>
            <div id="doc-ai-summary-content"></div>
          </div>

          <div id="doc-ai-hidden-notice" class="notice-warning hidden" data-i18n-html="docAIHiddenNotice"></div>

          <!-- Clinician Preliminary Impression & Searchable Test Orders -->
          <div class="order-panel">
            <h3 data-i18n="ordersPanelTitle"></h3>
            <p class="helper-text" data-i18n="ordersPanelDesc"></p>

            <!-- Clinician Preliminary Impression Feedback -->
            <label for="doc-prelim-note" class="input-label" data-i18n="docPrelimLabel"></label>
            <textarea id="doc-prelim-note" rows="3"></textarea>

            <!-- Quick Demo Chips -->
            <div class="quick-chips-row">
              <span class="quick-label" data-i18n="quickAddLabel"></span>
              <div id="quick-order-chips" class="quick-chips"></div>
            </div>

            <!-- Search & Custom Input -->
            <div class="search-order-wrap">
              <div class="qa-input-row">
                <input type="text" id="order-search-input" autocomplete="off" />
                <button id="btn-add-custom-order" class="btn secondary" type="button" data-i18n="btnAddOrder"></button>
              </div>
              <div id="order-suggestions" class="suggestions-dropdown hidden"></div>
            </div>

            <!-- Selected Order Tags -->
            <div class="selected-orders-wrap">
              <span class="input-label" data-i18n="selectedOrdersLabel"></span>
              <div id="selected-orders-container" class="tags-container"></div>
            </div>

            <button id="btn-confirm-orders" class="btn primary" type="button" data-i18n="btnConfirmOrders"></button>
            <div id="doc-order-feedback" class="feedback-banner hidden"></div>
          </div>
        </div>
      </div>

      <!-- Incoming Lab Report & Auditable Patient Q&A -->
      <div class="card">
        <div class="card-header">
          <h2 data-i18n="docLabHeading"></h2>
          <span class="badge implemented" data-i18n="badgeImplemented"></span>
        </div>

        <div id="doc-lab-empty" class="empty-state">
          <p class="helper-text" data-i18n="docLabEmpty"></p>
        </div>

        <div id="doc-lab-content" class="hidden">
          <div id="doc-lab-summary-body"></div>

          <!-- Auditable Shared Q&A Cards -->
          <div class="info-block">
            <h3 data-i18n="docQuestionsHeading"></h3>
            <p class="helper-text" data-i18n="docQuestionsAuditHint"></p>
            <div id="doc-questions-private-notice" class="notice-info hidden" data-i18n-html="docQuestionsPrivate"></div>
            <div id="doc-questions-shared-wrap" class="hidden">
              <p id="doc-no-questions" class="helper-text" data-i18n="docNoQuestions"></p>
              <div id="doc-questions-audit-list" class="audit-list hidden"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Final Clinical Diagnosis, Override, Optional AI Action Plan & Shared Screen Gate -->
      <div class="card">
        <div class="card-header">
          <h2 data-i18n="docFinalTitle"></h2>
          <span class="badge doctor-badge" data-i18n="badgeDoctorControl"></span>
        </div>

        <div id="doc-final-empty" class="empty-state">
          <p class="helper-text" data-i18n="docFinalEmpty"></p>
        </div>

        <div id="doc-final-controls" class="hidden">
          <p id="doc-final-desc" class="helper-text"></p>

          <div class="decision-grid">
            <label class="decision-option">
              <input type="radio" name="doc-decision" id="decision-agree" value="agree" />
              <div class="decision-card">
                <strong data-i18n="decisionAgreeTitle"></strong>
                <small id="decision-agree-sub"></small>
              </div>
            </label>
            <label class="decision-option">
              <input type="radio" name="doc-decision" id="decision-override" value="override" checked />
              <div class="decision-card">
                <strong data-i18n="decisionOverrideTitle"></strong>
                <small data-i18n="decisionOverrideSub"></small>
              </div>
            </label>
          </div>

          <div id="override-panel" class="override-panel">
            <label for="doc-custom-diagnosis" class="input-label" data-i18n="overrideDiagLabel"></label>
            <input type="text" id="doc-custom-diagnosis" />

            <span class="input-label" data-i18n="overrideReasonsLabel"></span>
            <div class="reason-list">
              <label class="checkbox-row">
                <input type="checkbox" id="reason-meds" checked />
                <span data-i18n="reasonMeds"></span>
              </label>
              <label class="checkbox-row">
                <input type="checkbox" id="reason-exam" checked />
                <span data-i18n="reasonExam"></span>
              </label>
              <label class="checkbox-row">
                <input type="checkbox" id="reason-lifestyle" checked />
                <span data-i18n="reasonLifestyle"></span>
              </label>
              <label class="checkbox-row">
                <input type="checkbox" id="reason-history" />
                <span data-i18n="reasonHistory"></span>
              </label>
            </div>

            <label for="doc-custom-reason" class="input-label" data-i18n="customReasonLabel"></label>
            <textarea id="doc-custom-reason" rows="2"></textarea>
          </div>

          <!-- Clinician-Authored Core Care Plan -->
          <label for="doc-care-plan" class="input-label" data-i18n="carePlanLabel"></label>
          <textarea id="doc-care-plan" rows="3"></textarea>

          <!-- NEW: Optional Clinician-Triggered AI Action Plan -->
          <div class="ai-assist-panel">
            <div class="ai-assist-header">
              <strong data-i18n="aiPlanPanelTitle"></strong>
              <p class="helper-text" style="margin:4px 0 0;" data-i18n="aiPlanPanelDesc"></p>
            </div>
            <div class="action-row" style="margin-top:10px;">
              <button id="btn-draft-ai-plan" class="btn ai-btn" type="button"></button>
              <button id="btn-clear-ai-plan" class="btn secondary hidden" type="button" data-i18n="btnClearAIPlan"></button>
            </div>
            <div id="ai-plan-loading" class="loading-box hidden">
              <div class="spinner"></div>
              <span id="ai-plan-loading-text"></span>
            </div>
            <div id="ai-plan-fallback-note" class="notice-warning hidden"></div>
            <div id="ai-plan-editor-wrap" class="ai-plan-editor hidden">
              <div class="ai-card-header" style="margin-bottom:6px;">
                <span id="ai-plan-source-badge" class="badge ai-badge"></span>
                <span class="disclaimer-tag" data-i18n="aiPlanEditHint"></span>
              </div>
              <textarea id="doc-ai-action-plan" rows="6"></textarea>
            </div>
          </div>

          <div class="action-row">
            <button id="btn-approve-shared" class="btn success" type="button" data-i18n="btnApproveShared"></button>
            <button id="btn-revoke-shared" class="btn danger-outline hidden" type="button" data-i18n="btnRevokeShared"></button>
          </div>
          <div id="doc-approve-feedback" class="feedback-banner hidden"></div>
        </div>
      </div>
    </section>

    <!-- ================= VIEW 3: SHARED DISPLAY ================= -->
    <section id="view-shared" class="view-section">
      <!-- Locked State -->
      <div id="shared-locked-state" class="card shared-lock-card">
        <div class="card-header">
          <h2 data-i18n="sharedTitle"></h2>
          <span class="badge doctor-badge" data-i18n="badgeDoctorGated"></span>
        </div>
        <div class="lock-box">
          <p class="lock-title" data-i18n="sharedLockTitle"></p>
          <p class="helper-text" data-i18n-html="sharedLockDesc"></p>
        </div>
      </div>

      <!-- Unlocked State (Doctor Approved) -->
      <div id="shared-unlocked-state" class="hidden">
        <div class="shared-toolbar">
          <div>
            <h2 data-i18n="sharedTitle"></h2>
            <span class="badge doctor-badge" data-i18n="badgeApprovedLive"></span>
          </div>
          <button id="btn-toggle-accessible" class="btn accessible-toggle" type="button"></button>
        </div>

        <div id="shared-content-wrapper">
          <!-- 1. Doctor Final Diagnosis + Strict Attribution for Care Plan -->
          <div class="card shared-doctor-card">
            <div class="card-header">
              <h3 data-i18n="sharedDocDiagHeading"></h3>
              <span class="badge doctor-verified-badge" data-i18n="badgeDoctorVerified"></span>
            </div>
            <p id="shared-final-diagnosis" class="final-diagnosis-text"></p>

            <!-- Doctor-Authored Core Care Plan -->
            <div class="care-plan-box">
              <div class="care-plan-header">
                <strong data-i18n="sharedCarePlanHeading"></strong>
                <span class="badge doctor-authored-badge" data-i18n="badgeDoctorAuthored"></span>
              </div>
              <p id="shared-care-plan"></p>
            </div>

            <!-- Optional AI-Drafted Home Execution Guide (Shown ONLY if clinician opted in) -->
            <div id="shared-ai-plan-box" class="shared-ai-plan-box hidden">
              <div class="ai-card-header" style="margin-bottom:8px;">
                <strong data-i18n="sharedAIPlanHeading"></strong>
                <span id="shared-ai-plan-badge" class="badge ai-badge"></span>
              </div>
              <div id="shared-ai-plan-content" class="shared-ai-plan-content"></div>
            </div>
          </div>

          <!-- 2. Alignment / Discordance Reconciliation -->
          <div id="shared-reconciliation-box" class="card"></div>

          <!-- 3. Verified Plain-Language Lab Summary -->
          <div class="card">
            <div class="card-header">
              <h3 data-i18n="sharedLabHeading"></h3>
              <span id="shared-lab-badge" class="badge ai-badge"></span>
            </div>
            <div id="shared-lab-summary"></div>
          </div>

          <!-- 4. Clinician-Audited Patient Discussion Questions -->
          <div id="shared-questions-card" class="card hidden">
            <div class="card-header">
              <h3 data-i18n="sharedQuestionsHeading"></h3>
              <span class="badge implemented" data-i18n="badgePatientShared"></span>
            </div>
            <div id="shared-questions-list" class="shared-qa-list"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- ================= OPTION B: AI ENGINE & CONTEXT MODAL ================= -->
  <div id="api-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="api-modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="api-modal-title" data-i18n="apiModalTitle"></h2>
        <button id="btn-close-api-modal" class="modal-close-btn" type="button" aria-label="Close">×</button>
      </div>

      <p class="helper-text" data-i18n-html="apiModalDesc"></p>

      <!-- Mode Switch -->
      <div class="decision-grid">
        <label class="decision-option">
          <input type="radio" name="ai-mode" id="mode-simulated" value="simulated" checked />
          <div class="decision-card">
            <strong data-i18n="modeSimTitle"></strong>
            <small data-i18n="modeSimSub"></small>
          </div>
        </label>
        <label class="decision-option">
          <input type="radio" name="ai-mode" id="mode-live" value="live" />
          <div class="decision-card">
            <strong data-i18n="modeLiveTitle"></strong>
            <small data-i18n="modeLiveSub"></small>
          </div>
        </label>
      </div>

      <!-- Live API BYOK Configuration -->
      <div id="live-api-fields" class="override-panel hidden">
        <div class="notice-warning" style="margin-top:0; margin-bottom:12px;" data-i18n-html="apiKeySecurityNote"></div>

        <label for="api-endpoint-input" class="input-label" data-i18n="apiEndpointLabel"></label>
        <input type="text" id="api-endpoint-input" value="https://api.openai.com/v1/chat/completions" />

        <label for="api-model-input" class="input-label" data-i18n="apiModelLabel"></label>
        <input type="text" id="api-model-input" value="gpt-4o-mini" />

        <label for="api-key-input" class="input-label" data-i18n="apiKeyLabel"></label>
        <input type="password" id="api-key-input" autocomplete="off" />

        <div class="action-row">
          <button id="btn-clear-api-key" class="btn secondary" type="button" data-i18n="btnClearKey"></button>
        </div>
      </div>

      <div class="action-row">
        <button id="btn-save-api-config" class="btn primary" type="button" data-i18n="btnSaveApiConfig"></button>
      </div>
      <div id="api-config-feedback" class="feedback-banner hidden"></div>

      <!-- Live Cross-Stage Context Memory Inspector -->
      <div class="context-inspector">
        <h3 data-i18n="contextTitle"></h3>
        <p class="helper-text" data-i18n="contextDesc"></p>
        <pre id="context-memory-preview" class="context-pre"></pre>
      </div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
